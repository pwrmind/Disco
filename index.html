<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTunes Search — поиск и прослушивание</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px 64px;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        h1 { font-size: 1.8rem; margin-bottom: 4px; }
        .subtitle { color: #6e6e73; margin-bottom: 24px; font-size: 0.95rem; }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1 1 240px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: #0071e3; }
        .search-bar select {
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
        }
        .search-bar button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #0071e3;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-bar button:hover { background: #0077ed; }
        .search-bar button:disabled { background: #a1a1a6; cursor: default; }

        #status { min-height: 24px; margin-bottom: 16px; color: #6e6e73; font-size: 0.95rem; }
        #status.error { color: #d70015; }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .result-card .top {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .result-card img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .result-card .meta { flex: 1; min-width: 0; }
        .result-card .track-name {
            font-weight: 600;
            font-size: 1rem;
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-card .artist-name {
            font-size: 0.9rem;
            color: #6e6e73;
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-card .collection-name {
            font-size: 0.8rem;
            color: #86868b;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-card .genre {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.75rem;
            background: #e8e8ed;
            padding: 2px 8px;
            border-radius: 20px;
            color: #1d1d1f;
        }
        .result-card audio {
            width: 100%;
            height: 36px;
            margin-top: auto;
            outline: none;
        }
        .result-card .no-preview {
            margin-top: auto;
            font-size: 0.8rem;
            color: #a1a1a6;
            text-align: center;
            padding: 8px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
        }
        .pagination button {
            padding: 8px 20px;
            border: 1px solid #d2d2d7;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination span { color: #6e6e73; font-size: 0.9rem; }

        footer {
            margin-top: 48px;
            text-align: center;
            font-size: 0.8rem;
            color: #a1a1a6;
        }
        footer a { color: #0071e3; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<h1>🎵 iTunes Search</h1>
<p class="subtitle">
    Поиск музыки в каталоге Apple. Нажмите ▶ чтобы прослушать 30-секундный отрывок.
</p>

<div class="search-bar">
    <input type="text" id="term" placeholder="Например: Taylor Swift, Daft Punk, Miles Davis…"
           value="Jack Johnson" autocomplete="off" />
    <select id="entity">
        <option value="song" selected>Песни</option>
        <option value="album">Альбомы</option>
        <option value="musicArtist">Исполнители</option>
        <option value="musicVideo">Видеоклипы</option>
    </select>
    <select id="limit">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
    </select>
    <button id="searchBtn" type="button">Найти</button>
</div>

<div id="status"></div>
<div id="results" class="results-grid"></div>

<div class="pagination" id="pagination" hidden>
    <button id="prevBtn" disabled>← Назад</button>
    <span id="pageInfo"></span>
    <button id="nextBtn">Вперёд →</button>
</div>

<footer>
    Данные предоставлены
    <a href="https://developer.apple.com/library/archive/documentation/AudioVideo/Conceptual/iTuneSearchAPI/"
       target="_blank" rel="noopener">iTunes Search API</a>.
    Отрывки принадлежат правообладателям.
</footer>

<script>
(function () {
    'use strict';

    // ----- DOM-элементы -----
    const termInput      = document.getElementById('term');
    const entitySelect   = document.getElementById('entity');
    const limitSelect    = document.getElementById('limit');
    const searchBtn      = document.getElementById('searchBtn');
    const statusEl       = document.getElementById('status');
    const resultsEl      = document.getElementById('results');
    const paginationEl   = document.getElementById('pagination');
    const prevBtn        = document.getElementById('prevBtn');
    const nextBtn        = document.getElementById('nextBtn');
    const pageInfoEl     = document.getElementById('pageInfo');

    // ----- Состояние -----
    let allResults    = [];     // все полученные записи
    let currentPage   = 0;
    const PAGE_SIZE   = 10;     // карточек на страницу
    let currentQuery  = '';     // для информации

    // ----- JSONP-загрузчик -----
    // iTunes Search API не отдаёт CORS-заголовки, поэтому используем JSONP.
    // Документация: API принимает параметр callback, например &callback=myFn.
    let jsonpCounter = 0;

    function jsonp(url, callbackName) {
        return new Promise((resolve, reject) => {
            const cbName = 'itunesJsonp_' + (++jsonpCounter) + '_' + Date.now();

            // Глобальная функция, которую вызовет Apple
            window[cbName] = function (data) {
                try {
                    resolve(data);
                } finally {
                    cleanup();
                }
            };

            function cleanup() {
                if (script.parentNode) script.parentNode.removeChild(script);
                try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
            }

            const script = document.createElement('script');
            script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
            script.onerror = function () {
                cleanup();
                reject(new Error('Не удалось загрузить JSONP-скрипт'));
            };
            document.body.appendChild(script);

            // Таймаут на случай, если Apple не ответит
            setTimeout(() => {
                if (window[cbName]) {
                    cleanup();
                    reject(new Error('Таймаут запроса'));
                }
            }, 15000);
        });
    }

    // ----- Поиск -----
    async function doSearch() {
        const term = termInput.value.trim();
        if (!term) {
            setStatus('Введите поисковый запрос.', true);
            return;
        }

        searchBtn.disabled = true;
        setStatus('Загрузка…');
        resultsEl.innerHTML = '';
        paginationEl.hidden = true;
        allResults = [];
        currentPage = 0;
        currentQuery = term;

        const entity = entitySelect.value;
        const limit  = limitSelect.value;

        const url =
            'https://itunes.apple.com/search' +
            '?term=' + encodeURIComponent(term) +
            '&entity=' + encodeURIComponent(entity) +
            '&limit=' + encodeURIComponent(limit) +
            '&country=US';

        try {
            const data = await jsonp(url);
            const items = Array.isArray(data.results) ? data.results : [];
            allResults = items;

            if (items.length === 0) {
                setStatus('Ничего не найдено. Попробуйте другой запрос.');
            } else {
                setStatus('Найдено записей: ' + items.length);
                renderPage(0);
            }
        } catch (err) {
            console.error(err);
            setStatus('Ошибка: ' + err.message, true);
        } finally {
            searchBtn.disabled = false;
        }
    }

    // ----- Отрисовка страницы -----
    function renderPage(page) {
        currentPage = page;
        const start = page * PAGE_SIZE;
        const slice = allResults.slice(start, start + PAGE_SIZE);

        resultsEl.innerHTML = '';
        slice.forEach(item => resultsEl.appendChild(createCard(item)));

        // Пагинация
        const totalPages = Math.ceil(allResults.length / PAGE_SIZE);
        if (totalPages > 1) {
            paginationEl.hidden = false;
            pageInfoEl.textContent = 'Страница ' + (page + 1) + ' из ' + totalPages;
            prevBtn.disabled = page === 0;
            nextBtn.disabled = page >= totalPages - 1;
        } else {
            paginationEl.hidden = true;
        }
    }

    // ----- Создание карточки -----
    function createCard(item) {
        const card = document.createElement('div');
        card.className = 'result-card';

        // Обложка
        const artwork = item.artworkUrl100 || item.artworkUrl60 || '';
        const img = document.createElement('img');
        img.src = artwork;
        img.alt = 'Обложка';
        img.loading = 'lazy';
        img.onerror = () => { img.style.visibility = 'hidden'; };

        // Метаданные
        const meta = document.createElement('div');
        meta.className = 'meta';

        const trackName = document.createElement('p');
        trackName.className = 'track-name';
        trackName.textContent = item.trackName || item.collectionName || 'Без названия';

        const artistName = document.createElement('p');
        artistName.className = 'artist-name';
        artistName.textContent = item.artistName || '';

        const collectionName = document.createElement('p');
        collectionName.className = 'collection-name';
        collectionName.textContent = item.collectionName || '';

        meta.appendChild(trackName);
        meta.appendChild(artistName);
        if (item.collectionName && item.collectionName !== trackName.textContent) {
            meta.appendChild(collectionName);
        }

        // Жанр
        if (item.primaryGenreName) {
            const genre = document.createElement('span');
            genre.className = 'genre';
            genre.textContent = item.primaryGenreName;
            meta.appendChild(genre);
        }

        const top = document.createElement('div');
        top.className = 'top';
        top.appendChild(img);
        top.appendChild(meta);
        card.appendChild(top);

        // Аудиоплеер
        if (item.previewUrl) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.preload = 'none';
            audio.src = item.previewUrl;
            card.appendChild(audio);
        } else {
            const noPreview = document.createElement('div');
            noPreview.className = 'no-preview';
            noPreview.textContent = 'Нет отрывка';
            card.appendChild(noPreview);
        }

        return card;
    }

    // ----- Вспомогательное -----
    function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.classList.toggle('error', !!isError);
    }

    // ----- Обработчики -----
    searchBtn.addEventListener('click', doSearch);

    termInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            doSearch();
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentPage > 0) renderPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
        const totalPages = Math.ceil(allResults.length / PAGE_SIZE);
        if (currentPage < totalPages - 1) renderPage(currentPage + 1);
    });

    // Автозапуск при загрузке (можно убрать)
    // doSearch();
})();
</script>
</body>
</html>
