<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000' rx='22'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%231DB954'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23000'/%3E%3C/svg%3E">

  <title>Disco — Music Discovery</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100%; width: 100%; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #app-root { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

    /* HUD */
    .hud { 
      position: absolute; top: 0; left: 0; right: 0; 
      padding: calc(16px + env(safe-area-inset-top)) 20px 16px; 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 30; 
      pointer-events: none; 
    }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -.5px; display: flex; align-items: center; gap: 8px; text-shadow: 0 2px 4px rgba(0,0,0,.5); transition: opacity .2s; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #1DB954; box-shadow: 0 0 10px #1DB954; }
    .tabs { display: flex; gap: 20px; font-size: 15px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,.5); transition: opacity .2s; }
    .tab { color: rgba(255,255,255,.5); transition: color .3s; cursor: pointer; pointer-events: auto; background: none; border: none; padding: 0; font-family: inherit; font-size: inherit; }
    .tab.active { color: #fff; }
    .search-icon { pointer-events: auto; cursor: pointer; padding: 8px; margin-right: -8px; background: none; border: none; color: white; }

    /* Панель поиска */
    .search-bar { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 20px; right: 20px; display: flex; align-items: center; gap: 8px; z-index: 50; opacity: 0; pointer-events: none; transform: translateY(-10px); transition: all .3s cubic-bezier(.16,1,.3,1); }
    .search-bar.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .search-form { flex: 1; position: relative; display: flex; align-items: center; margin: 0; min-width: 0; }
    .search-form svg { position: absolute; left: 12px; fill: #888; pointer-events: none; }
    .search-bar input { width: 100%; background: rgba(40,40,40,.8); -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px); border: none; border-radius: 12px; padding: 12px 12px 12px 40px; color: #fff; font-size: 16px; outline: none; font-family: inherit; -webkit-appearance: none; appearance: none; }
    .search-bar input::-webkit-search-cancel-button { display: none; }
    .search-bar input::placeholder { color: #888; }
    .search-submit { color: #000; font-weight: 700; font-size: 14px; background: #1DB954; border: none; border-radius: 10px; padding: 11px 16px; cursor: pointer; white-space: nowrap; }
    .search-submit:active { background: #1aa84b; }
    .cancel-btn { color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; padding: 8px 0; background: none; border: none; white-space: nowrap; }
    .hud.searching .brand, .hud.searching .tabs, .hud.searching .search-icon { opacity: 0; pointer-events: none; }

    .feed-container {
      width: 100%; height: 100%; position: relative;
      will-change: transform; touch-action: none;
      overflow: hidden; /* #9 фикс */
    }

    /* Карточка трека */
    .track-card { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; display: block; }
    .track-card .bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(40px) brightness(.35) saturate(1.2); transform: scale(1.1); z-index: 0; }
    .track-card .gradient { position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, rgba(0,0,0,.2) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 100%); }
    .track-card .content { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; padding: 80px 20px calc(20px + env(safe-area-inset-bottom)); }
    .track-card .center { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 20px 0; }
    .track-card .cover { max-width: 100%; max-height: 100%; aspect-ratio: 1; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,.5); object-fit: cover; }
    
    .track-card .play-hint {
      position: absolute; top: 50%; left: 50%;
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 5;
    }
    .track-card .center.paused .play-hint {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .track-card .bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 16px; }
    .track-card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .track-card .title { font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-card .artist { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.9); }
    .track-card .album { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 400; margin-top: -2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-card .tag { align-self: flex-start; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: 10px; margin-top: 6px; backdrop-filter: blur(5px); }
    .track-card .store { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #000; text-decoration: none; padding: 10px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; width: fit-content; margin-top: 4px; }
    .track-card .sidebar { display: flex; flex-direction: column; gap: 20px; align-items: center; flex-shrink: 0; }

    .action-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; padding: 0; color: white; }
    .action-btn .btn-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(30,30,30,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; transition: transform .15s ease; }
    .action-btn:active .btn-icon { transform: scale(.9); background: rgba(50,50,50,.8); }
    .action-btn .count { font-size: 12px; font-weight: 600; margin-top: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    .action-btn.active .btn-icon svg { fill: #ff2d55; }

    .audio-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.25); z-index: 3; }
    .audio-progress .fill { height: 100%; width: 0%; background: #fff; transition: width .1s linear; }

    /* Комментарии */
    .comments-sheet { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
    .comments-sheet[opened="true"] { pointer-events: auto; }
    .comments-sheet .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .comments-sheet[opened="true"] .backdrop { opacity: 1; }
    .comments-sheet .sheet { position: absolute; bottom: 0; left: 0; right: 0; height: 60dvh; background: #1c1c1e; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform .35s cubic-bezier(.16,1,.3,1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
    .comments-sheet[opened="true"] .sheet { transform: translateY(0); }
    .comments-sheet .handle { width: 100%; height: 30px; display: flex; justify-content: center; align-items: center; cursor: grab; }
    .comments-sheet .handle-bar { width: 40px; height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; }
    .comments-sheet .header { padding: 0 20px 15px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .comments-sheet .close { padding: 5px; cursor: pointer; background: none; border: none; }
    .comments-sheet .body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; overscroll-behavior: contain; /* #10 */ -webkit-overflow-scrolling: touch; }
    .comments-sheet .comment { display: flex; gap: 14px; font-size: 14px; }
    .comments-sheet .avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
    .comments-sheet .c-body { display: flex; flex-direction: column; gap: 4px; }
    .comments-sheet .c-author { font-weight: 600; color: #888; font-size: 12px; }
    .comments-sheet .c-text { line-height: 1.4; color: #eee; }
    .comments-sheet .input-bar { padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.08); display: flex; gap: 10px; }
    .comments-sheet input { flex: 1; background: #2c2c2e; border: none; padding: 12px 16px; border-radius: 20px; color: #fff; font-size: 15px; outline: none; }
    .comments-sheet .send { background: #fff; color: #000; border: none; padding: 0 20px; border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; }

    /* Загрузка и пустые состояния */
    .loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 20; pointer-events: none; }
    .loading.active { display: flex; opacity: 1; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.1); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 15; color: #888; gap: 10px; background: #000; padding: 24px; }
    .empty-state.active { display: flex; }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
    .empty-state .title { font-size: 18px; font-weight: 600; color: #fff; text-align: center; }
    .empty-state .subtitle { font-size: 14px; text-align: center; max-width: 80%; opacity: 0.7; }
    .empty-state .retry-btn { margin-top: 16px; padding: 10px 24px; background: #1DB954; color: #000; border: none; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; display: none; }
    .empty-state .retry-btn.visible { display: inline-block; }

    svg { display: block; }

    /* Панель отладки */
    #debug-btn {
      position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); right: 12px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15); font-size: 13px;
      z-index: 99998; cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0.5; transition: opacity 0.2s, background 0.2s; font-family: inherit;
    }
    #debug-btn.has-errors { background: rgba(255,45,85,0.85); color: #fff; opacity: 1; animation: dbg-pulse 1.4s infinite; }
    @keyframes dbg-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    #debug-panel {
      position: fixed; bottom: 0; left: 0; right: 0; height: 50vh;
      background: rgba(8,8,10,0.97); color: #fff;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px; line-height: 1.35;
      z-index: 99997; display: none; flex-direction: column;
      border-top: 1px solid #1DB954; padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(10px);
    }
    #debug-panel.open { display: flex; }
    #debug-panel .dbg-head { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid #222; align-items: center; flex-shrink: 0; }
    #debug-panel .dbg-head strong { color: #1DB954; font-size: 11px; }
    #debug-panel .dbg-status { flex: 1; color: #666; font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #debug-panel .dbg-head button { background: #222; color: #fff; border: none; border-radius: 4px; padding: 5px 9px; font-size: 10px; font-weight: 600; cursor: pointer; font-family: inherit; }
    #debug-panel .dbg-head button.primary { background: #1DB954; color: #000; }
    #debug-panel .dbg-log { flex: 1; overflow-y: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
    #debug-panel .dbg-row { padding: 2px 0; word-break: break-all; white-space: pre-wrap; border-bottom: 1px solid rgba(255,255,255,0.03); }
    #debug-panel .dbg-row .ts { color: #555; }
    #debug-panel .dbg-row.info  { color: #aaa; }
    #debug-panel .dbg-row.success { color: #1DB954; }
    #debug-panel .dbg-row.warn  { color: #f5a623; }
    #debug-panel .dbg-row.error { color: #ff5577; }
    #debug-panel .dbg-row.net   { color: #4a90e2; }
  </style>
</head>
<body>

<div id="app-root">
  <!-- HUD -->
  <div class="hud" id="hud">
    <div class="brand"><div class="dot"></div>Disco</div>
    <div class="tabs">
      <button class="tab active" id="tab-feed">Для вас</button>
      <button class="tab" id="tab-liked">Избранное</button>
    </div>
    <button class="search-icon" id="search-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="search-bar" id="search-bar">
    <form class="search-form" id="search-form">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#888"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="search" id="search-input" placeholder="Поиск..." enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </form>
    <button class="search-submit" id="search-submit" type="button">Найти</button>
    <button class="cancel-btn" id="cancel-btn" type="button">Отмена</button>
  </div>

  <!-- Feed -->
  <div class="feed-container" id="feed-container"></div>

  <!-- Empty State -->
  <div class="empty-state" id="empty-state">
    <div class="icon">🔍</div>
    <div class="title" id="empty-title">Введите запрос</div>
    <div class="subtitle" id="empty-subtitle">Нажмите на лупу вверху и введите название трека или исполнителя.</div>
    <button class="retry-btn" id="retry-btn">Повторить</button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading"><div class="spinner"></div></div>
</div>

<script>
/* =========================================================
   DEBUG PANEL
   ========================================================= */
const Debug = (function () {
  const MAX_ENTRIES = 200;
  const entries = [];
  let panelOpen = false;
  let errorCount = 0;

  const btn = document.createElement('button');
  btn.id = 'debug-btn';
  btn.textContent = '🐞';

  const panel = document.createElement('div');
  panel.id = 'debug-panel';
  panel.innerHTML = `
    <div class="dbg-head">
      <strong>Debug</strong>
      <span class="dbg-status" id="dbg-status">—</span>
      <button id="dbg-copy">Copy</button>
      <button id="dbg-clear">Clear</button>
      <button id="dbg-close">✕</button>
    </div>
    <div class="dbg-log" id="dbg-log"></div>
  `;
  let logArea;

  function add(type, args) {
    const ts = new Date().toISOString().slice(11, 23);
    let msg;
    try {
      msg = Array.from(args).map(a => {
        if (a instanceof Error) return `${a.name}: ${a.message}`;
        if (typeof a === 'object' && a !== null) {
          try { return JSON.stringify(a); } catch (_) { return String(a); }
        }
        return String(a);
      }).join(' ');
    } catch (_) { msg = '(unserializable)'; }

    entries.push({ type, msg, ts });
    if (entries.length > MAX_ENTRIES) entries.shift();

    if (logArea) {
      const row = document.createElement('div');
      row.className = 'dbg-row ' + type;
      row.innerHTML = `<span class="ts">[${ts}]</span> ${escapeHtml(type.toUpperCase())}: ${escapeHtml(msg)}`;
      logArea.appendChild(row);
      while (logArea.children.length > MAX_ENTRIES) logArea.removeChild(logArea.firstChild);
      logArea.scrollTop = logArea.scrollHeight;
    }

    if (type === 'error') {
      errorCount++;
      btn.classList.add('has-errors');
      btn.textContent = '⚠';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function toggle() { panelOpen = !panelOpen; panel.classList.toggle('open', panelOpen); }

  function mount() {
    document.body.appendChild(btn);
    document.body.appendChild(panel);
    logArea = document.getElementById('dbg-log');
    btn.addEventListener('click', toggle);
    document.getElementById('dbg-close').addEventListener('click', toggle);
    document.getElementById('dbg-copy').addEventListener('click', () => {
      const text = entries.map(e => `[${e.ts}] ${e.type.toUpperCase()}: ${e.msg}`).join('\n');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          const b = document.getElementById('dbg-copy');
          b.textContent = '✓ Copied';
          setTimeout(() => { b.textContent = 'Copy'; }, 1200);
        }).catch(() => alert('Не удалось скопировать'));
      } else { alert(text); }
    });
    document.getElementById('dbg-clear').addEventListener('click', () => {
      entries.length = 0; errorCount = 0; logArea.innerHTML = '';
      btn.classList.remove('has-errors'); btn.textContent = '🐞';
    });
    add('info', ['UA:', navigator.userAgent]);
    add('info', ['URL:', location.href]);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();

  return {
    info:    (...a) => add('info', a),
    success: (...a) => add('success', a),
    warn:    (...a) => add('warn', a),
    error:   (...a) => add('error', a),
    net:     (...a) => add('net', a),
    status:  (t) => { const el = document.getElementById('dbg-status'); if (el) el.textContent = t; },
  };
})();

['log', 'warn', 'error'].forEach((m) => {
  const orig = console[m];
  console[m] = function (...args) {
    try { Debug[m === 'log' ? 'info' : m](...args); } catch (_) {}
    if (orig) orig.apply(console, args);
  };
});
window.addEventListener('error', (e) => Debug.error('window.onerror:', e.message, '@', e.filename + ':' + e.lineno + ':' + e.colno));
window.addEventListener('unhandledrejection', (e) => Debug.error('unhandledrejection:', String(e.reason)));

/* =========================================================
   APP CODE
   ========================================================= */
const ICONS = {
  heart: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
  comment: 'M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z',
  share: 'M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z',
  close: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  external: 'M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z',
  play: 'M8 5v14l11-7z',
};
const svg = (n, s = 24, f = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" xmlns="http://www.w3.org/2000/svg"><path d="${ICONS[n] || ''}"/></svg>`;

/* =========================================================
   GLOBAL AUDIO (единый элемент — фикс #2 #3)
   ========================================================= */
const globalAudio = new Audio();
globalAudio.preload = 'auto';
let currentAudioTrack = null;
let audioUnlocked = false;
let fadeInterval = null;

// Silent WAV для "разлочки" на iOS
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

function unlockAudio() {
  if (audioUnlocked) return;
  try {
    globalAudio.src = SILENT_WAV;
    globalAudio.volume = 0;
    const p = globalAudio.play();
    if (p && p.then) {
      p.then(() => {
        globalAudio.pause();
        globalAudio.currentTime = 0;
        audioUnlocked = true;
        Debug.success('audio:', 'unlocked');
      }).catch(() => { /* ignore */ });
    } else {
      audioUnlocked = true;
    }
  } catch (_) { /* ignore */ }
}

function fadeAudio(from, to, ms) {
  if (fadeInterval) clearInterval(fadeInterval);
  const steps = 20; let i = 0;
  fadeInterval = setInterval(() => {
    i++;
    const t = i / steps;
    globalAudio.volume = Math.max(0, Math.min(1, from + (to - from) * t));
    if (i >= steps) { clearInterval(fadeInterval); fadeInterval = null; }
  }, Math.max(10, ms / steps));
}

globalAudio.addEventListener('play', () => {
  const card = feedContainer.querySelector('.track-card[data-position="0"]');
  if (card) card.querySelector('.center')?.classList.remove('paused');
});
globalAudio.addEventListener('pause', () => {
  const card = feedContainer.querySelector('.track-card[data-position="0"]');
  if (card) card.querySelector('.center')?.classList.add('paused');
});
globalAudio.addEventListener('ended', () => {
  const card = feedContainer.querySelector('.track-card[data-position="0"]');
  if (card) {
    card.querySelector('.center')?.classList.add('paused');
    const fill = card.querySelector('.audio-progress .fill');
    if (fill) fill.style.width = '0%';
  }
});
globalAudio.addEventListener('timeupdate', () => {
  const card = feedContainer.querySelector('.track-card[data-position="0"]');
  if (!card) return;
  const fill = card.querySelector('.audio-progress .fill');
  if (!fill) return;
  const duration = globalAudio.duration || 1;
  fill.style.width = `${(globalAudio.currentTime / duration) * 100}%`;
});
globalAudio.addEventListener('error', () => {
  Debug.warn('audio:', 'error code:', globalAudio.error && globalAudio.error.code,
             '| track:', currentAudioTrack && currentAudioTrack.name);
});

/* =========================================================
   STATE
   ========================================================= */
let feedTracks = [];
let likedTracks = JSON.parse(localStorage.getItem('disco_liked_tracks') || '[]');
let activeIndex = 0;
let currentView = 'feed';
let tracks = feedTracks;
let currentQuery = '';
let requestSeq = 0;
let jsonpCounter = 0;
let globalAutoplay = false;
let isAnimating = false; // фикс #4
const viewState = { feed: 0, liked: 0 }; // фикс #5

const feedContainer = document.getElementById('feed-container');
const loadingEl = document.getElementById('loading');
const emptyStateEl = document.getElementById('empty-state');
const emptyTitle = document.getElementById('empty-title');
const emptySubtitle = document.getElementById('empty-subtitle');
const retryBtn = document.getElementById('retry-btn');
const hudEl = document.getElementById('hud');
const searchBar = document.getElementById('search-bar');
const searchInput = document.getElementById('search-input');
const tabFeed = document.getElementById('tab-feed');
const tabLiked = document.getElementById('tab-liked');
const searchBtn = document.getElementById('search-btn');
const cancelBtn = document.getElementById('cancel-btn');
const searchForm = document.getElementById('search-form');
const searchSubmit = document.getElementById('search-submit');

let cardHeight = window.innerHeight;
function updateHeight() { cardHeight = feedContainer.clientHeight; }
window.addEventListener('resize', updateHeight);

function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'K' : n; }

function stopAllAudio() {
  try {
    globalAudio.pause();
    globalAudio.currentTime = 0;
  } catch (_) {}
  currentAudioTrack = null;
  if (fadeInterval) { clearInterval(fadeInterval); fadeInterval = null; }
  globalAudio.volume = 1;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* =========================================================
   JSONP
   ========================================================= */
function jsonp(url, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cbName = 'itunesJsonp_' + (++jsonpCounter) + '_' + Date.now();
    let done = false;

    window[cbName] = (data) => {
      if (done) return; done = true;
      Debug.success('jsonp:', 'callback fired, resultCount =', data && data.resultCount);
      cleanup(); resolve(data);
    };

    function cleanup() {
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
    }

    const script = document.createElement('script');
    const fullUrl = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    script.src = fullUrl;
    Debug.info('jsonp:', 'GET', fullUrl);

    script.onerror = () => {
      if (done) return; done = true;
      Debug.error('jsonp:', 'script.onerror');
      cleanup(); reject(new Error('Script load error'));
    };

    document.body.appendChild(script);

    setTimeout(() => {
      if (done) return; done = true;
      Debug.error('jsonp:', 'TIMEOUT', timeoutMs, 'ms');
      cleanup(); reject(new Error('Timeout'));
    }, timeoutMs);
  });
}

function parseTracks(data) {
  const results = (data && data.results) || [];
  const collected = [];
  for (const t of results) {
    if (!t.previewUrl || !t.artworkUrl100) continue;
    collected.push({
      id: t.trackId,
      name: t.trackName || t.collectionName || 'Без названия',
      artist: t.artistName || '',
      album: t.collectionName || '',
      image: t.artworkUrl100.replace('100x100bb', '600x600bb'),
      previewUrl: t.previewUrl,
      storeUrl: t.trackViewUrl || '#',
      genres: t.primaryGenreName ? [t.primaryGenreName] : ['Music'],
      // #8 детерминированные лайки
      likeCount: 500 + ((t.trackId || 0) % 5000),
    });
  }
  Debug.info('parse:', 'total', results.length, '| usable', collected.length);
  return collected;
}

async function fetchTracks(term) {
  const url =
    'https://itunes.apple.com/search' +
    '?term=' + encodeURIComponent(term) +
    '&entity=song' +
    '&limit=25' +
    '&country=US';

  Debug.status('loading…');
  const data = await jsonp(url, 15000);
  return parseTracks(data);
}

/* =========================================================
   Карточка трека
   ========================================================= */
function createCard(track, position) {
  const card = document.createElement('div');
  card.className = 'track-card';
  card.style.transform = `translateY(${position * 100}%)`;
  card.dataset.position = position;

  const isLiked = likedTracks.some(t => t.id === track.id);
  const displayLikes = fmt((track.likeCount || 0) + (isLiked ? 1 : 0));

  card.innerHTML = `
    <div class="bg" style="background-image: url('${track.image}')"></div>
    <div class="gradient"></div>
    <div class="content">
      <div class="center paused">
        <img class="cover" src="${track.image}" alt="cover">
        <div class="play-hint">${svg('play', 32, '#fff')}</div>
      </div>
      <div class="bottom">
        <div class="info">
          <div class="title">${escapeHtml(track.name)}</div>
          <div class="artist">${escapeHtml(track.artist)}</div>
          <div class="album">${escapeHtml(track.album)}</div>
          <div class="tag">#${escapeHtml(track.genres[0] || 'Music')}</div>
          <a class="store" href="${track.storeUrl}" target="_blank" rel="noopener">
            ${svg('external', 14, '#000')} Слушать полностью
          </a>
        </div>
        <div class="sidebar">
          <button class="action-btn ${isLiked ? 'active' : ''}" data-action="like">
            <div class="btn-icon">${svg('heart', 22, isLiked ? '#ff2d55' : '#fff')}</div>
            <span class="count">${displayLikes}</span>
          </button>
          <button class="action-btn" data-action="comment">
            <div class="btn-icon">${svg('comment', 22, '#fff')}</div>
            <span class="count">154</span>
          </button>
          <button class="action-btn" data-action="share">
            <div class="btn-icon">${svg('share', 22, '#fff')}</div>
          </button>
        </div>
      </div>
    </div>
    <div class="audio-progress"><div class="fill"></div></div>
    <div class="comments-sheet" opened="false">
      <div class="backdrop"></div>
      <div class="sheet">
        <div class="handle"><div class="handle-bar"></div></div>
        <div class="header">
          <span>Комментарии</span>
          <button class="close">${svg('close', 20, '#888')}</button>
        </div>
        <div class="body">
          <div class="comment">
            <div class="avatar">M</div>
            <div class="c-body">
              <div class="c-author">MusicLover</div>
              <div class="c-text">Этот трек просто пушка! 🔥</div>
            </div>
          </div>
        </div>
        <div class="input-bar">
          <input type="text" placeholder="Добавить..." maxlength="100">
          <button class="send">Отправить</button>
        </div>
      </div>
    </div>
  `;

  // Воспроизведение через общий элемент
  card.play = () => {
    unlockAudio();
    const isDifferent = !currentAudioTrack || currentAudioTrack.id !== track.id;
    if (isDifferent) {
      currentAudioTrack = track;
      globalAudio.src = track.previewUrl;
      globalAudio.currentTime = 0;
      globalAudio.volume = 0;
      globalAudio.play()
        .then(() => fadeAudio(0, 1, 400))
        .catch(e => Debug.warn('audio:', 'play rejected:', e.message));
    } else {
      // тот же трек — просто продолжаем
      globalAudio.play().catch(e => Debug.warn('audio:', 'play rejected:', e.message));
    }
  };

  const togglePlay = () => {
    const isCurrentPlaying = currentAudioTrack &&
                             currentAudioTrack.id === track.id &&
                             !globalAudio.paused;
    if (isCurrentPlaying) {
      globalAudio.pause();
      globalAutoplay = false;
    } else {
      globalAutoplay = true;
      card.play();
    }
  };

  card.querySelector('.content').addEventListener('click', (e) => {
    if (e.target.closest('a,button')) return;
    togglePlay();
  });

  // Лайк
  const likeBtn = card.querySelector('[data-action="like"]');
  likeBtn.addEventListener('click', () => {
    const wasLiked = likedTracks.some(t => t.id === track.id);
    if (wasLiked) likedTracks = likedTracks.filter(t => t.id !== track.id);
    else likedTracks.push(track);
    localStorage.setItem('disco_liked_tracks', JSON.stringify(likedTracks));

    const nowLiked = !wasLiked;
    likeBtn.classList.toggle('active', nowLiked);
    const ico = likeBtn.querySelector('svg');
    if (ico) ico.style.fill = nowLiked ? '#ff2d55' : '#fff';
    const cnt = likeBtn.querySelector('.count');
    if (cnt) cnt.textContent = fmt((track.likeCount || 0) + (nowLiked ? 1 : 0));

    if (currentView === 'liked' && wasLiked) {
      tracks = likedTracks;
      if (tracks.length === 0) {
        stopAllAudio();
        viewState.liked = 0;
        showEmpty('Нет избранных треков', 'Добавьте треки в избранное.', false);
      } else {
        if (activeIndex >= tracks.length) activeIndex = tracks.length - 1;
        viewState.liked = activeIndex;
        renderWindow(true);
      }
    }
  });

  // Шторка комментариев
  const sheet = card.querySelector('.comments-sheet');
  const sheetEl = card.querySelector('.sheet');
  const handle = card.querySelector('.handle');

  const isThisTrackCurrent = () => currentAudioTrack && currentAudioTrack.id === track.id;

  const openSheet = () => {
    sheet.setAttribute('opened', 'true');
    card.dataset.sheetOpen = 'true';
    if (isThisTrackCurrent() && !globalAudio.paused) globalAudio.volume = 0.1;
  };
  const closeSheet = () => {
    sheet.setAttribute('opened', 'false');
    delete card.dataset.sheetOpen;
    if (isThisTrackCurrent() && !globalAudio.paused) globalAudio.volume = 1;
    sheetEl.style.transform = '';
    sheetEl.style.transition = '';
  };
  card.querySelector('[data-action="comment"]').addEventListener('click', openSheet);
  card.querySelector('.close').addEventListener('click', closeSheet);
  card.querySelector('.backdrop').addEventListener('click', closeSheet);

  let startY = 0, curY = 0, isDragging = false;
  const onSheetMove = (e) => {
    if (!isDragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const d = y - startY;
    if (d > 0) {
      curY = d;
      sheetEl.style.transition = 'none';
      sheetEl.style.transform = `translateY(${d}px)`;
      if (e.cancelable) e.preventDefault();
    }
  };
  const onSheetEnd = () => {
    if (!isDragging) return;
    isDragging = false;
    sheetEl.style.transition = '';
    if (curY > sheetEl.offsetHeight * 0.25) closeSheet();
    else sheetEl.style.transform = '';
    curY = 0;
  };

  handle.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
    isDragging = true;
    const move = (ev) => onSheetMove(ev);
    const end = () => {
      onSheetEnd();
      sheetEl.removeEventListener('touchmove', move);
      sheetEl.removeEventListener('touchend', end);
    };
    sheetEl.addEventListener('touchmove', move, { passive: false });
    sheetEl.addEventListener('touchend', end);
  }, { passive: true });

  handle.addEventListener('mousedown', (e) => {
    startY = e.clientY;
    isDragging = true;
    const move = (ev) => onSheetMove(ev);
    const end = () => {
      onSheetEnd();
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', end);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
  });

  card.querySelector('[data-action="share"]').addEventListener('click', async () => {
    if (navigator.share) {
      try { await navigator.share({ title: track.name, url: track.storeUrl }); } catch (_) {}
    } else if (navigator.clipboard) {
      try { await navigator.clipboard.writeText(track.storeUrl); } catch (_) {}
    }
  });

  return card;
}

function renderWindow(shouldAutoplay = false) {
  stopAllAudio();

  // #1 + #12: сначала очищаем, потом мгновенно сбрасываем сдвиг контейнера
  feedContainer.innerHTML = '';
  feedContainer.style.transition = 'none';
  feedContainer.style.transform = 'translateY(0)';

  if (tracks.length === 0) return;

  const prevIndex = activeIndex - 1;
  const nextIndex = activeIndex + 1;

  if (prevIndex >= 0) feedContainer.appendChild(createCard(tracks[prevIndex], -1));
  const mainCard = createCard(tracks[activeIndex], 0);
  feedContainer.appendChild(mainCard);
  if (nextIndex < tracks.length) feedContainer.appendChild(createCard(tracks[nextIndex], 1));

  if (shouldAutoplay && globalAutoplay && mainCard.play) {
    mainCard.play();
  }
}

function showEmpty(title, subtitle, isError) {
  emptyTitle.textContent = title;
  emptySubtitle.textContent = subtitle;
  retryBtn.classList.toggle('visible', !!isError);
  emptyStateEl.classList.add('active');
  feedContainer.innerHTML = '';
  feedContainer.style.transform = 'translateY(0)';
}

function setView(view) {
  stopAllAudio();

  // #5: сохранить текущую позицию перед переключением
  if (currentView === 'feed') viewState.feed = activeIndex;
  else viewState.liked = activeIndex;

  currentView = view;
  if (view === 'feed') {
    tabFeed.classList.add('active'); tabLiked.classList.remove('active');
    tracks = feedTracks;
    activeIndex = viewState.feed;
  } else {
    tabLiked.classList.add('active'); tabFeed.classList.remove('active');
    tracks = likedTracks;
    activeIndex = viewState.liked;
  }
  if (activeIndex >= tracks.length) activeIndex = Math.max(0, tracks.length - 1);

  loadingEl.classList.remove('active');
  emptyStateEl.classList.remove('active');

  if (tracks.length === 0) {
    showEmpty(
      view === 'feed' ? 'Введите запрос' : 'Нет избранных треков',
      view === 'feed' ? 'Нажмите на лупу вверху и введите название.' : 'Добавьте треки в избранное.',
      false
    );
    return;
  }
  renderWindow(true);
}

async function runSearch(query) {
  currentQuery = query;
  loadingEl.classList.add('active');
  emptyStateEl.classList.remove('active');
  retryBtn.classList.remove('visible');

  const mySeq = ++requestSeq;
  let newTracks = null;
  try {
    newTracks = await fetchTracks(query);
  } catch (e) {
    if (mySeq !== requestSeq) return;
    loadingEl.classList.remove('active');
    Debug.error('runSearch:', 'failed:', e.message);
    showEmpty('Ошибка запроса', 'Не удалось получить данные. Откройте 🐞 для деталей.', true);
    return;
  }

  if (mySeq !== requestSeq) {
    Debug.warn('runSearch:', 'stale response dropped');
    return;
  }

  feedTracks = newTracks;
  tracks = feedTracks;
  activeIndex = 0;
  viewState.feed = 0;

  if (currentView !== 'feed') {
    currentView = 'feed';
    tabFeed.classList.add('active');
    tabLiked.classList.remove('active');
  }
  stopAllAudio();

  if (tracks.length === 0) {
    showEmpty('Ничего не найдено', 'По запросу «' + escapeHtml(query) + '» ничего не найдено.', true);
  } else {
    renderWindow(true);
  }
  loadingEl.classList.remove('active');
}

function commitSearch() {
  const q = searchInput.value.trim();
  if (q.length < 2) return;
  runSearch(q);
}

/* =========================================================
   Обработчики UI
   ========================================================= */
searchBtn.addEventListener('click', () => {
  unlockAudio();
  searchBar.classList.add('active');
  hudEl.classList.add('searching');
  setTimeout(() => searchInput.focus(), 100);
});

cancelBtn.addEventListener('click', () => {
  searchInput.blur();
  searchBar.classList.remove('active');
  hudEl.classList.remove('searching');
  searchInput.value = '';
});

searchForm.addEventListener('submit', (e) => { e.preventDefault(); commitSearch(); });
searchSubmit.addEventListener('click', (e) => { e.preventDefault(); commitSearch(); });
tabFeed.addEventListener('click', () => setView('feed'));
tabLiked.addEventListener('click', () => setView('liked'));
retryBtn.addEventListener('click', () => runSearch(currentQuery));

/* =========================================================
   Свайпы ленты
   ========================================================= */
let swipeStartY = 0, swipeCurrentY = 0, isSwiping = false, swipeStartTime = 0;
const swipeThreshold = 0.1;
let isMouseDown = false;

const onSwipeStart = (e) => {
  if (isAnimating) return; // #4
  const card = feedContainer.querySelector('.track-card[data-position="0"]');
  if (card && card.dataset.sheetOpen) return;

  const y = e.touches ? e.touches[0].clientY : e.clientY;
  swipeStartY = y; swipeCurrentY = 0; isSwiping = true; swipeStartTime = Date.now();
  feedContainer.style.transition = 'none';
};

const onSwipeMove = (e) => {
  if (!isSwiping || isAnimating) return; // #4
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  let d = y - swipeStartY;

  if ((activeIndex === 0 && d > 0) || (activeIndex === tracks.length - 1 && d < 0)) d *= 0.2;

  swipeCurrentY = d;
  feedContainer.style.transform = `translateY(${d}px)`;

  if (Math.abs(d) > 8 && e.cancelable) e.preventDefault();
};

const onSwipeEnd = () => {
  if (!isSwiping) return;
  isSwiping = false;

  const timeElapsed = Date.now() - swipeStartTime;
  const isFastFlick = timeElapsed < 300 && Math.abs(swipeCurrentY) > 20;
  const threshold = cardHeight * swipeThreshold;

  const goNext = (swipeCurrentY < -threshold || (isFastFlick && swipeCurrentY < 0)) && activeIndex < tracks.length - 1;
  const goPrev = (swipeCurrentY > threshold || (isFastFlick && swipeCurrentY > 0)) && activeIndex > 0;

  if (goNext) {
    isAnimating = true;
    // Пред-разлок аудио ещё в user gesture
    unlockAudio();
    feedContainer.style.transition = 'transform .35s cubic-bezier(0.25, 1, 0.5, 1)';
    feedContainer.style.transform = `translateY(-100%)`;
    setTimeout(() => {
      activeIndex++;
      if (currentView === 'feed') viewState.feed = activeIndex;
      else viewState.liked = activeIndex;
      renderWindow(true);
      isAnimating = false;
    }, 350);
  } else if (goPrev) {
    isAnimating = true;
    unlockAudio();
    feedContainer.style.transition = 'transform .35s cubic-bezier(0.25, 1, 0.5, 1)';
    feedContainer.style.transform = `translateY(100%)`;
    setTimeout(() => {
      activeIndex--;
      if (currentView === 'feed') viewState.feed = activeIndex;
      else viewState.liked = activeIndex;
      renderWindow(true);
      isAnimating = false;
    }, 350);
  } else {
    feedContainer.style.transition = 'transform .35s cubic-bezier(0.25, 1, 0.5, 1)';
    feedContainer.style.transform = `translateY(0)`;
  }
  swipeCurrentY = 0;
};

feedContainer.addEventListener('touchstart', onSwipeStart, { passive: true });
feedContainer.addEventListener('touchmove', onSwipeMove, { passive: false });
feedContainer.addEventListener('touchend', onSwipeEnd);
feedContainer.addEventListener('mousedown', (e) => {
  if (!e.target.closest('a,button')) { isMouseDown = true; onSwipeStart(e); }
});
window.addEventListener('mousemove', (e) => { if (isMouseDown) onSwipeMove(e); });
window.addEventListener('mouseup', () => {
  if (isMouseDown) { isMouseDown = false; onSwipeEnd(); }
});

/* =========================================================
   Инициализация
   ========================================================= */
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
document.addEventListener('mousedown', unlockAudio, { once: true });

window.addEventListener('DOMContentLoaded', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      for (const r of regs) r.unregister();
    });
  }
  updateHeight();
  showEmpty('Введите запрос', 'Нажмите на лупу вверху и введите название трека или исполнителя.', false);
});
</script>
